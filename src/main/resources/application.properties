# 本地随机端口；需要固定端口时改为 server.port=8080
server.port=0

# ===== 功率遥测服务参数（均可通过环境变量 POWER_SERVICE_* 覆盖）=====
# 统计窗口长度（毫秒，默认 60s）
power.service.window-ms=60000
# 允许的最大历史时间范围（毫秒，默认 24h）
power.service.max-history-ms=86400000
# 允许的未来时钟偏差（毫秒）
power.service.future-tolerance-ms=5000
# 允许乱序迟到窗口（毫秒，默认 5min）：早于水位线超过该值判 TIME_ROLLBACK
power.service.allowed-lateness-ms=300000
# 内存保留窗口数
power.service.retained-windows=2880
# 采样中断墙钟扫描周期（毫秒）
power.service.interruption-sweep-ms=1000
# 告警去抖：连续违规/恢复采样点数
power.service.trigger-consecutive=3
power.service.recover-consecutive=3
# 全局默认阈值（设备可单独覆盖）
power.service.default-over-voltage=253.0
power.service.default-under-voltage=198.0
power.service.default-over-current=32.0
power.service.default-over-power=7000.0
power.service.default-max-sample-gap=30000
# 本地 JSON 快照路径与落盘时机
power.service.snapshot-file=data/snapshot.json
power.service.snapshot-after-each-batch=true
# 鉴权：本地验证默认关闭；开启后需为管理接口配置管理员令牌
power.service.auth-enabled=false
power.service.admin-token=
