# 本地独立运行端口
server.port=8080

# ===== 设备功率遥测：窗口与接入语义 =====
# 窗口长度（毫秒，默认 1 分钟）
power.telemetry.window-ms=60000
# 为乱序到达保留的窗口数量（窗口总数 = retainWindows，默认 15 个 = 15 分钟）
power.telemetry.retain-windows=15
# 允许的未来时间偏差（毫秒）
power.telemetry.future-skew-ms=60000
# 允许的最大数据年龄（毫秒，默认 24 小时）
power.telemetry.max-age-ms=86400000
# 允许乱序回退的范围（毫秒）；比设备最新已接受点回退超过该值视为明显时间回退并拒绝
power.telemetry.reorder-lag-ms=600000
# 本地状态文件目录（每设备一个 JSON，原子替换；服务重启从这里恢复）
power.telemetry.data-dir=data
# 写接口（设备阈值/开关）管理令牌
power.telemetry.admin-token=local-admin-token
# 采样中断后台扫描间隔（毫秒）
power.telemetry.tick-interval-ms=1000

# ===== 阈值默认值（可被设备级配置逐字段覆盖） =====
power.telemetry.default-over-voltage-v=253.0
power.telemetry.default-under-voltage-v=207.0
power.telemetry.default-over-current-a=16.0
power.telemetry.default-over-power-w=3680.0
power.telemetry.default-interruption-timeout-ms=300000
power.telemetry.default-breach-times=3
power.telemetry.default-recover-times=3

# 业务日志：单测/运行时可看到设备、采样时间、窗口和判定依据
logging.level.com.github.xingjianluo.powertelemetryalertingjava=INFO
